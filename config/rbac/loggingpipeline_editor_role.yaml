# This rule is not used by the project logging-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the jjsiv.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: logging-operator
    app.kubernetes.io/managed-by: kustomize
  name: loggingpipeline-editor-role
rules:
- apiGroups:
  - jjsiv.io
  resources:
  - loggingpipelines
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - jjsiv.io
  resources:
  - loggingpipelines/status
  verbs:
  - get
